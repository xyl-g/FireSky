# Mobile cross-target linker wiring.
# Android 配方源自 MM0 尖峰（spikes 已删，坑清单见 docs/ECCODES_CROSS_COMPILE_NOTES.md）
# (ecCodes 静态库含 C++ 段 → -lc++_static -lc++abi，见 MM0 坑 5）。
# iOS 链接需 Xcode 工具链（MM0 坑 11；真机 SDK 的 ___chkstk_darwin 需显式补
# libclang_rt.ios.a，坑 6）。仅影响移动目标；host 构建不受影响。

# 可移植性约定：机器本地的 rustc/rustdoc 钉扎（MM0 坑 8）与 DEVELOPER_DIR /
# ANDROID_NDK_ROOT（MM0 坑 11）放在全局 ~/.cargo/config.toml，不入库。仓库
# 配置不得在 [build] 或全局 [env] 里写 /Users/xiaoyang 等绝对路径，否则 CI
# runner（ubuntu/macos/windows）会因 rustc 路径不存在而直接失败。
#
# v1.9.7 走查：Android 的 CC/AR/linker 不再入库——darwin-x86_64 绝对路径
# 会让 ubuntu runner 的 cc-rs 直接失败（v1.9.5 mobile-release 失败根因）。
# 注入路径改为双通道：gradle cargoAndroidEngine 任务按本机 NDK 派生
# （apps/mobile-android/app/build.gradle.kts），直跑 cargo 的场景
# （build-all.sh / 手动）走机器本地 ~/.cargo/config.toml（见仓库根注释）。
# iOS 保留：/Applications/Xcode.app 路径在所有 macOS runner 上存在。
[env]
CC_aarch64_apple_ios = "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
CFLAGS_aarch64_apple_ios = "-isysroot /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"

[target.aarch64-apple-ios]
linker = "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
rustflags = [
    "-C", "link-arg=-isysroot",
    "-C", "link-arg=/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk",
    "-C", "link-arg=-lc++",
    "-C", "link-arg=/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/21/lib/darwin/libclang_rt.ios.a",
]

[target.aarch64-apple-ios-sim]
linker = "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
rustflags = [
    "-C", "link-arg=-isysroot",
    "-C", "link-arg=/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk",
    "-C", "link-arg=-lc++",
]
