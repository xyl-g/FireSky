[package]
name = "engine-mobile"
version = "1.9.6"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "engine_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
firesky-engine = { path = "../engine" }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
