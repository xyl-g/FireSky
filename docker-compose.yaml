# firesky 部署（单服务；redis 可选，仅用于 /data/latest/refresh 周期缓存）
# 启动：FIRESKY_IMAGE_TAG=local docker compose up -d --build

name: firesky

services:
  firesky:
    image: firesky:${FIRESKY_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${FIRESKY_HTTP_PORT:-8765}:8765"
    environment:
      FIRESKY_CONFIG: /app/etc/web_server.yaml
      FIRESKY_NATIVE_VARIANT: cpu
      FIRESKY_NATIVE_LIBRARY_PATH: /app/native/libfiresky_native_cpu.so
      # 可选：redis 周期缓存（不配置也能运行）
      FIRESKY_REDIS_ADDR: ${FIRESKY_REDIS_ADDR:-}
    volumes:
      - firesky-cache:/data/cache
      - firesky-cams:/data/cams
      - firesky-reports:/data/reports
      - firesky-logs:/data/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8765/api/v1/sunset/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # 可选：周期缓存 redis；删除本服务并把 FIRESKY_REDIS_ADDR 留空即可
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  firesky-cache:
  firesky-cams:
  firesky-reports:
  firesky-logs:
  redis-data:
