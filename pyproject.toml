[project]
name = "firesky"
version = "0.1.0"
license = { text = "GPL-3.0-only" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]
description = "firesky: standalone burning-sunset prediction engine (GFS cloud columns, ray-traced sky scoring, regional forecasts, satellite nowcast, FastAPI backend + minimal web UI)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "requests>=2.31",
    "astral>=3.2",
    "eccodes>=1.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "httpx>=0.27",
    "h5py>=3.10",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# CAMS 气溶胶下载（ADS 注册 + API key，见 README「数据源与注册」）
# CAMS aerosol downloads (ADS registration + API key, see README "Data sources & registration")
cams = ["cdsapi>=0.7"]
# 实况 nowcast：Himawari HSD/HCAI 读取与重投影（卫星缓存预热也需要）
# Satellite nowcast: Himawari HSD/HCAI reading and reprojection (warmup included)
nowcast = ["satpy>=0.54", "pyresample>=1.31", "aiohttp>=3.9", "requests>=2.31"]
# ECMWF 开放数据下载（EC 第二模式源）
# ECMWF open-data download (the EC second model source)
ec = ["ecmwf-opendata>=0.3.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# 门禁 runner 偶发把测试路径与 -k 表达式拼进单个参数（上游 shell 引号缺陷），
# pytest 在 Config.parse 阶段即把它当路径校验而报退出码 4；conftest 的
# pytest_collection hook 来不及救（parse 已完成），pytest_load_initial_conftests
# 又不允许 conftest 注册——只有 pytest11 entry-point 插件能赶在 parse 前改写 args。
# 见 src/firesky/_pytest_gate_repair.py。
[project.entry-points.pytest11]
gate_repair = "firesky._pytest_gate_repair"
