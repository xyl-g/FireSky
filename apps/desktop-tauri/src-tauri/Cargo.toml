[package]
name = "firesky-desktop"
version = "0.1.0"
description = "FireSky Tauri 2 desktop shell (native firesky-engine IPC)"
edition = "2021"
# 版本与 bundle identifier 以 tauri.conf.json 为单一来源（蓝图 R11：收敛
# cn.firesky.desktop+0.1.0，对齐 pyproject；不再出现 0.1.1/0.2.0/app.firesky.native 漂移）。

# 说明：桌面专用骨架只有 main.rs 入口（无移动端，不需要 Tauri 模板的
# lib.rs + [lib] 段；引入移动目标时再加）。

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 子进程与 JSON-lines 帧桥直接用 std::process + std::sync::mpsc 实现
# （sidecar.rs），不需要 tauri-plugin-shell / tokio 额外依赖；
# id 生成对齐两端客户端（Swift UUID / C# Guid "N"）。
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
