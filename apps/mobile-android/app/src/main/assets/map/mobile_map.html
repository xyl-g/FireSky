<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
html, body, #map {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #E9EFF6;
  -webkit-tap-highlight-color: transparent;
}
body.dark, body.dark #map {
  background: #0E1728;
}
.leaflet-tile-pane.inverted-dark {
  filter: invert(96%) hue-rotate(180deg) brightness(94%) contrast(88%) saturate(85%);
}
.fs-pin-wrap {
  position: relative;
  width: 28px;
  height: 28px;
}
.fs-pin-halo {
  position: absolute;
  inset: 2px;
  border-radius: 50%;
  background: rgba(210, 90, 54, 0.28);
}
.fs-pin-core {
  position: absolute;
  left: 7px;
  top: 7px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #D25A36;
  border: 2.5px solid #FFFFFF;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
}
body.dark .fs-pin-core {
  background: #FF9B6A;
}
#offline-hint {
  position: absolute;
  inset: 12px auto auto 12px;
  display: none;
  width: max-content;
  max-width: calc(100% - 64px);
  box-sizing: border-box;
  align-items: center;
  justify-content: flex-start;
  pointer-events: none;
  z-index: 500;
  color: rgba(27, 34, 36, 0.52);
  font: 500 11px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  text-align: left;
  padding: 6px 8px;
  border: 1px solid rgba(120, 139, 160, 0.2);
  border-radius: 6px;
  background: rgba(248, 250, 252, 0.9);
}
body.dark #offline-hint {
  color: rgba(230, 237, 240, 0.56);
  border-color: rgba(151, 168, 187, 0.2);
  background: rgba(14, 23, 40, 0.9);
}
</style>
<title>FireSky Map</title>
</head>
<body>
<div id="map"></div>
<div id="offline-hint">Map unavailable · tap or zoom</div>
<script src="leaflet/leaflet.js"></script>
<script>
window.onerror = function(msg, src, line, col) {
  console.error('map error:', msg, src, line, col);
};
if (navigator.language.toLowerCase().startsWith('zh')) {
  document.getElementById('offline-hint').textContent = '底图不可用，仍可点按或缩放';
}
const STOPS = [
  [0.00, [253, 230, 220]],
  [0.20, [251, 176, 122]],
  [0.45, [245, 124, 102]],
  [0.70, [237, 91, 130]],
  [1.00, [201, 60, 145]]
];

function duskFill(quality) {
  const t = Math.min(1, Math.max(0, quality / 2.5));
  for (let i = 1; i < STOPS.length; i++) {
    if (t <= STOPS[i][0]) {
      const [l0, a] = STOPS[i - 1];
      const [r0, b] = STOPS[i];
      const f = (t - l0) / (r0 - l0);
      const rgb = a.map((v, j) => Math.round(v + (b[j] - v) * f));
      const alpha = t <= 0.001 ? 0.08 : (0.18 + 0.72 * Math.sqrt(t));
      return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha.toFixed(3)})`;
    }
  }
  return 'rgba(201,60,145,0.90)';
}

function normalizeLon(lon) {
  let x = ((lon + 540) % 360) - 180;
  return x === -180 ? 180 : x;
}

const INITIAL_MODE = new URLSearchParams(window.location.search).get('mode') === 'regional' ? 'regional' : 'point';
const DEFAULT_CHINA_BOUNDS = [[18.0, 73.0], [54.0, 136.0]];

const map = L.map('map', {
  preferCanvas: true,
  attributionControl: false,
  zoomControl: false,
  worldCopyJump: true
});

if (INITIAL_MODE === 'regional') {
  map.fitBounds(DEFAULT_CHINA_BOUNDS, { padding: [14, 14], animate: false });
} else {
  map.setView([30.25, 120.25], 10);
}

let isDark = false;
let mapMode = INITIAL_MODE;
let activeTileLayer = null;
let lastPointKey = '';
let lastBoundsKey = '';
let activeRegionalBounds = INITIAL_MODE === 'regional' ? DEFAULT_CHINA_BOUNDS : null;
let regionalUserInteracted = false;

function makeLightAutoNavi() {
  return L.tileLayer(
    'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}',
    { subdomains: '1234', maxZoom: 18, detectRetina: false }
  );
}

function makeLightOsmFallback() {
  return L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 19 }
  );
}

function setOfflineHint(show) {
  const el = document.getElementById('offline-hint');
  if (el) el.style.display = show ? 'flex' : 'none';
}

function applyTileLayer(dark) {
  isDark = !!dark;
  document.body.classList.toggle('dark', isDark);
  setOfflineHint(false);
  const pane = map.getPane('tilePane');
  if (activeTileLayer) {
    map.removeLayer(activeTileLayer);
    activeTileLayer = null;
  }
  if (pane) pane.classList.remove('inverted-dark');

  const providers = isDark
    ? [
        { name: 'autonavi-dark', make: makeLightAutoNavi, invert: true },
        { name: 'osm-dark', make: makeLightOsmFallback, invert: true }
      ]
    : [
        { name: 'autonavi', make: makeLightAutoNavi, invert: false },
        { name: 'osm', make: makeLightOsmFallback, invert: false }
      ];

  let idx = 0;
  function attachNext() {
    if (idx >= providers.length) {
      setOfflineHint(true);
      console.warn('all tile providers failed');
      return;
    }
    const spec = providers[idx++];
    if (pane) pane.classList.toggle('inverted-dark', spec.invert);
    let errCount = 0;
    let loadedAny = false;
    let switched = false;
    const layer = spec.make();
    layer.on('tileload', () => {
      if (!loadedAny) {
        loadedAny = true;
        setOfflineHint(false);
        console.log('tileload ok provider=' + spec.name);
      }
    });
    layer.on('tileerror', () => {
      errCount++;
      if (!switched && !loadedAny && errCount >= 3 && activeTileLayer === layer) {
        switched = true;
        console.warn('tileerror switching from ' + spec.name);
        map.removeLayer(layer);
        attachNext();
      }
    });
    activeTileLayer = layer.addTo(map);
  }
  attachNext();
}

const pinIcon = L.divIcon({
  className: '',
  html: '<div class="fs-pin-wrap"><div class="fs-pin-halo"></div><div class="fs-pin-core"></div></div>',
  iconSize: [28, 28],
  iconAnchor: [14, 14]
});

const pinMarker = L.marker([30.25, 120.25], { icon: pinIcon, interactive: false });
if (INITIAL_MODE !== 'regional') {
  pinMarker.addTo(map);
}
const regionalLayer = L.layerGroup().addTo(map);

map.on('dragstart zoomstart', () => {
  if (mapMode === 'regional') {
    regionalUserInteracted = true;
  }
});

applyTileLayer(false);

map.on('click', (e) => {
  const lat = Math.max(-85, Math.min(85, e.latlng.lat));
  const lon = normalizeLon(e.latlng.lng);
  if (mapMode === 'regional') {
    window.AndroidMapBridge?.onSelectRegional(lat, lon);
  } else {
    pinMarker.setLatLng([lat, lon]);
    window.AndroidMapBridge?.onSelectPoint(lat, lon);
  }
});

window.fireSkyMap = {
  probe() {
    const el = document.getElementById('map');
    return {
      dark: isDark,
      w: el ? el.clientWidth : 0,
      h: el ? el.clientHeight : 0,
      tiles: document.querySelectorAll('.leaflet-tile').length,
      markers: document.querySelectorAll('.fs-pin-core').length
    };
  },
  setTheme(dark) {
    const next = !!dark;
    if (next !== isDark || !activeTileLayer) {
      applyTileLayer(next);
    }
  },
  setPoint(lat, lon, zoom, recenter) {
    mapMode = 'point';
    activeRegionalBounds = null;
    lastBoundsKey = '';
    map.invalidateSize(false);
    regionalLayer.clearLayers();
    if (!map.hasLayer(pinMarker)) pinMarker.addTo(map);
    const key = `${lat.toFixed(5)},${lon.toFixed(5)},${zoom}`;
    pinMarker.setLatLng([lat, lon]);
    if (recenter || lastPointKey === '') {
      const targetZoom = typeof zoom === 'number' && zoom > 0 ? zoom : map.getZoom();
      map.setView([lat, lon], targetZoom, { animate: lastPointKey !== '' });
    }
    lastPointKey = key;
  },
  zoomBy(delta) {
    if (delta > 0) map.zoomIn();
    else map.zoomOut();
  },
  setRegional(payloadJson) {
    const state = typeof payloadJson === 'string' ? JSON.parse(payloadJson) : payloadJson;
    mapMode = 'regional';
    lastPointKey = '';
    map.invalidateSize(false);
    if (map.hasLayer(pinMarker)) map.removeLayer(pinMarker);
    regionalLayer.clearLayers();

    const bounds = Array.isArray(state.bounds) && state.bounds.length >= 4
      ? state.bounds : [73.0, 18.0, 136.0, 54.0];
    const [west, south, east, north] = bounds;
    const boundsKey = bounds.join(',');
    const leafletBounds = [[south, west], [north, east]];
    activeRegionalBounds = leafletBounds;
    if (boundsKey !== lastBoundsKey) {
      regionalUserInteracted = false;
      map.fitBounds(leafletBounds, { padding: [14, 14], animate: false });
      lastBoundsKey = boundsKey;
    }

    const outlineColor = isDark ? '#58B6C0' : '#198D98';
    L.rectangle([[south, west], [north, east]], {
      color: outlineColor,
      weight: 1.4,
      dashArray: '4 3',
      fill: true,
      fillColor: outlineColor,
      fillOpacity: 0.06,
      interactive: false
    }).addTo(regionalLayer);

    const cells = Array.isArray(state.cells) ? state.cells : [];
    const latHalf = Math.max(0.125, (state.latStep || 0.25) * 0.5);
    const lonHalf = Math.max(0.125, (state.lonStep || 0.25) * 0.5);
    for (const cell of cells) {
      const hasQuality = typeof cell.q === 'number' && Number.isFinite(cell.q) && cell.q >= 0;
      L.rectangle(
        [[cell.lat - latHalf, cell.lon - lonHalf], [cell.lat + latHalf, cell.lon + lonHalf]],
        {
          stroke: false,
          fillColor: hasQuality ? duskFill(cell.q) : (isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)'),
          fillOpacity: hasQuality ? 0.85 : 0.35,
          interactive: false
        }
      ).addTo(regionalLayer);
    }

    const cities = Array.isArray(state.cities) ? state.cities : [];
    for (const city of cities) {
      const hasQuality = typeof city.q === 'number' && Number.isFinite(city.q);
      L.circleMarker([city.lat, city.lon], {
        radius: 4.5,
        color: '#FFFFFF',
        weight: 1.5,
        fillColor: hasQuality ? duskFill(city.q) : '#8A94A6',
        fillOpacity: 0.95,
        interactive: false
      }).addTo(regionalLayer);
    }

    if (state.selected && Number.isFinite(state.selected.lat) && Number.isFinite(state.selected.lon)) {
      L.circleMarker([state.selected.lat, state.selected.lon], {
        radius: 7.5,
        color: isDark ? '#FFE082' : '#1A237E',
        weight: 2.2,
        fill: false,
        interactive: false
      }).addTo(regionalLayer);
    }
  }
};

function syncSizeAndRegionalBounds() {
  map.invalidateSize(false);
  const sz = map.getSize();
  if (mapMode === 'regional' && activeRegionalBounds && !regionalUserInteracted && sz.x > 0 && sz.y > 0) {
    map.fitBounds(activeRegionalBounds, { padding: [14, 14], animate: false });
  }
}

if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => syncSizeAndRegionalBounds()).observe(document.getElementById('map'));
}
setTimeout(() => syncSizeAndRegionalBounds(), 120);
</script>
</body>
</html>
