name: FireSkyMobile
options:
  bundleIdPrefix: cn.firesky
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.2.0"
    CURRENT_PROJECT_VERSION: "34"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: "NO"
targets:
  FireSkyMobile:
    type: application
    platform: iOS
    sources:
      - path: FireSkyMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.firesky.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: 用于扫描 FireSky 桌面端或 Docker 生成的配对二维码以连接服务器。
    info:
      path: FireSkyMobile/Info.plist
      properties:
        CFBundleDisplayName: FireSky
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocationWhenInUseUsageDescription: 用于获取当前位置作为观测点，以便预测朝霞与晚霞。
        NSCameraUsageDescription: 用于扫描 FireSky 桌面端或 Docker 生成的配对二维码以连接服务器。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    scheme:
      testTargets:
        - FireSkyMobileTests
        - FireSkyMobileUITests
  FireSkyMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FireSkyMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.firesky.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FireSkyMobile.app/FireSkyMobile
        BUNDLE_LOADER: $(TEST_HOST)
  FireSkyMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: FireSkyMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.firesky.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FireSkyMobile
