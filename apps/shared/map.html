<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'none';">
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
html,body,#map{height:100%;margin:0;font-family:system-ui,sans-serif}
.pin{width:14px;height:14px;background:#e63d5c;border:3px solid white;border-radius:50%;box-shadow:0 2px 8px #0004}
.legend{background:#ffffffee;border-radius:6px;padding:8px 10px;font-size:10px;line-height:1.5;color:#333;box-shadow:0 1px 6px #0003}
.legend .bar{width:140px;height:10px;border-radius:3px;background:linear-gradient(to right,#fde6dc,#fbb07a,#f57c66,#ed5b82,#c93c91)}
.legend .row{display:flex;justify-content:space-between;width:140px}
.legend .missing{display:inline-block;width:10px;height:10px;border-radius:2px;background:#8a8a8a66;border:1px solid #8a8a8a;margin-right:4px;vertical-align:-1px}
.sample{border:1px solid #ffffff;box-shadow:0 0 0 .5px #0002}
</style>
<title>FireSky</title>
</head>
<body>
<div id="map"></div>
<script src="leaflet/leaflet.js"></script>
<script>
// 固定色带（对齐 macOS RegionalPalette / Web BurnOutlookMap fillForScore）：
// 质量 0–2.5 线性映射，缺测灰、不填零、不解释成晴空。
const STOPS=[[0,[253,230,220]],[.2,[251,176,122]],[.45,[245,124,102]],[.7,[237,91,130]],[1,[201,60,145]]];
function fill(quality){
  const t=Math.min(1,Math.max(0,quality/2.5));
  for(let i=1;i<STOPS.length;i++){
    if(t<=STOPS[i][0]){
      const [l0,a]=STOPS[i-1],[r0,b]=STOPS[i];
      const f=(t-l0)/(r0-l0);
      const rgb=a.map((v,j)=>Math.round(v+(b[j]-v)*f));
      const alpha=t<=.001?12:Math.round(42+190*Math.sqrt(t));
      return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha/255})`;
    }
  }
  return 'rgba(201,60,145,.91)';
}
function sampleColor(quality){
  return fill(quality);
}
const map=L.map('map',{preferCanvas:true}).setView([30.25,120.25],8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);
const grid=L.layerGroup().addTo(map);
const samples=L.layerGroup().addTo(map);
const pin=L.marker([30.25,120.25],{
  icon:L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[20,20],iconAnchor:[10,10]})
}).addTo(map);
const legend=L.control({position:'bottomright'});
legend.onAdd=()=>{
  const div=L.DomUtil.create('div','legend');
  div.innerHTML='<div class="bar"></div>'
    +'<div class="row"><span>0</span><span>质量 1.25</span><span>2.5</span></div>'
    +'<div style="margin-top:4px"><span class="missing"></span>缺测（不参与排行）</div>'
    +'<div>青色边框：预测区域外框</div>';
  return div;
};
legend.addTo(map);
let lastKey='',regionalMode=false,drawing=false,drawStart=null,drawRect=null,dragWasDisabled=false;
function cell(lat,lon,value){
  const valid=typeof value==='number'&&Number.isFinite(value)&&value>=0;
  return L.rectangle([[lat-.125,lon-.125],[lat+.125,lon+.125]],{
    color:valid?'rgba(0,0,0,0)':'#8a8a8a',weight:valid?0:.8,fillColor:valid?fill(value):'#8a8a8a',
    fillOpacity:valid?.9:.35,interactive:false
  }).addTo(grid);
}
function areaOutline(west,south,east,north){
  // 覆盖边界常显；west>east 为跨 180° 短弧（引擎短弧语义）。
  return L.rectangle([[south,west],[north,east]],{
    color:'#198d98',weight:1.2,fill:false,interactive:false
  }).addTo(grid);
}
function gridLines(west,south,east,north){
  // west<east 为普通区域；跨 180°（west>east）拆成两段 180 以内的分段。
  const style={color:'#198d98',weight:.7,opacity:.7,interactive:false};
  const segments=west<east?[[west,east]]:[[west,180],[-180,east]];
  const width=segments.reduce((sum,seg)=>sum+(seg[1]-seg[0]),0);
  const nx=Math.floor(width/.25),ny=Math.floor((north-south)/.25);
  const lines=L.layerGroup();
  for(let y=0;y<=ny;y++){
    const lat=south+y*.25;
    for(const [w,e] of segments){
      L.polyline([[lat,w-.125],[lat,e+.125]],style).addTo(lines);
    }
  }
  for(let x=0;x<=nx;x++){
    let lon=west+x*.25;
    if(lon>180)lon-=360;
    for(const [w,e] of segments){
      const segLon=lon>=w&&lon<=e?lon:(lon<w?lon+360:lon-360);
      if(segLon>=w-.001&&segLon<=e+.001){
        L.polyline([[south,segLon],[north,segLon]],style).addTo(lines);
        break;
      }
    }
  }
  return lines;
}
function fitWrapped(south,west,north,east,padding){
  // 跨 180° 时 Leaflet 直接以两个角点构造 bounds，可表达短弧视图。
  map.fitBounds([[south,west],[north,east]],{padding:padding||[35,35]});
}
window.fireSky={update(state){
  const {lat,lon,west,east,south,north,regional,points,samples:sampleRows,selected_time:selectedTime}=state;
  regionalMode=!!regional;
  const key=JSON.stringify([lat,lon,west,east,south,north,regional,
    (points||[]).length,(sampleRows||[]).length,selectedTime||'']);
  pin.setLatLng([lat,lon]);grid.clearLayers();samples.clearLayers();
  if(regional){
    const hasBounds=Number.isFinite(west)&&Number.isFinite(east)
      &&Number.isFinite(south)&&Number.isFinite(north)&&north>south;
    if(hasBounds){
      if(key!==lastKey&&!drawing)fitWrapped(south,west,north,east);
      areaOutline(west,south,east,north);
      if(state.show_grid!==false)gridLines(west,south,east,north);
    }
    if(Array.isArray(sampleRows)){
      for(const p of sampleRows){
        if(!Number.isFinite(p.lat)||!Number.isFinite(p.lon))continue;
        const value=p.peak_quality_index??p.quality_index;
        const valid=typeof value==='number'&&Number.isFinite(value);
        const family=p.pressure_family==='high'?'高云压力族':p.pressure_family==='middle'?'中云压力族'
          :p.pressure_family==='low'?'低云压力族':'无';
        const percent=v=>Number.isFinite(v)?`${Math.round(v*100)}`:'—';
        const quality=valid?value.toFixed(3):'未计算';
        const color=valid?sampleColor(value):'#8a8a8a73';
        L.circleMarker([p.lat,p.lon],{
          radius:4,color:'#ffffff',weight:1,fillColor:color,fillOpacity:.9,className:'sample'
        }).bindTooltip(`${p.peak_quality_level??'—'} · ${quality}/2.5\n主导可烧压力族 ${family}`
          +`\n高/中/低云 ${percent(p.high_cloud)}/${percent(p.mid_cloud)}/${percent(p.low_cloud)}%`)
          .addTo(samples);
      }
    }
  }else if(key!==lastKey&&!drawing)map.setView([lat,lon],14);
  if(Array.isArray(points))for(const p of points){
    if(Number.isFinite(p.lat)&&Number.isFinite(p.lon))cell(p.lat,p.lon,p.peak_quality_index??p.quality_index);
  }
  lastKey=key;
}};
// 区域拖拽绘制（regional 模式）：按下拖动超过阈值即绘制，松开发送范围。
// 跨 180° 取短弧：east>180 时折回，west>east 表达跨线。
map.on('mousedown',e=>{
  if(!regionalMode||drawing)return;
  drawing=true;drawStart=e.latlng;
  if(map.dragging.enabled()){map.dragging.disable();dragWasDisabled=true;}
});
map.on('mousemove',e=>{
  if(!drawing||!drawStart)return;
  const bounds=L.latLngBounds(drawStart,e.latlng);
  if(drawRect)grid.removeLayer(drawRect);
  drawRect=L.rectangle(bounds,{color:'#198d98',weight:1,dashArray:'4 3',fill:false,interactive:false}).addTo(grid);
});
map.on('mouseup',e=>{
  if(!drawing||!drawStart)return;
  if(drawRect){grid.removeLayer(drawRect);drawRect=null;}
  const end=e.latlng;
  drawing=false;
  if(dragWasDisabled){map.dragging.enable();dragWasDisabled=false;}
  const moved=Math.abs(end.lat-drawStart.lat)+Math.abs(end.lng-drawStart.lng);
  if(moved<.05){drawStart=null;return;}
  // 短弧语义：取拖动方向上的短弧，端点归一化到 (-180,180]。
  const norm=v=>{let x=v;while(x<=-180)x+=360;while(x>180)x-=360;return x;};
  let west=norm(drawStart.lng),east=norm(end.lng);
  let arc=east-west;
  while(arc>180)arc-=360;
  while(arc<=-180)arc+=360;
  if(arc>=0){east=west+arc;}else{const w=west;west=east;east=w-arc;}
  east=norm(east);west=norm(west);
  const south=Math.min(drawStart.lat,end.lat),north=Math.max(drawStart.lat,end.lat);
  window.chrome?.webview?.postMessage({type:'region',
    west:Math.round(west*1e6)/1e6,east:Math.round(east*1e6)/1e6,
    south:Math.round(south*1e6)/1e6,north:Math.round(north*1e6)/1e6});
  drawStart=null;
});
map.on('click',e=>window.chrome?.webview?.postMessage({type:'point',lat:e.latlng.lat,lon:e.latlng.lng}));
window.chrome?.webview?.postMessage({type:'ready'});
</script>
</body>
</html>
