<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'none';">
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
html,body,#map{height:100%;margin:0;font-family:system-ui,sans-serif}
.pin{width:14px;height:14px;background:#e63d5c;border:3px solid white;border-radius:50%;box-shadow:0 2px 8px #0004}
</style>
<title>FireSky</title>
</head>
<body>
<div id="map"></div>
<script src="leaflet/leaflet.js"></script>
<script>
const map=L.map('map',{preferCanvas:true}).setView([30.25,120.25],8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);
const grid=L.layerGroup().addTo(map);
const pin=L.marker([30.25,120.25],{
  icon:L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[20,20],iconAnchor:[10,10]})
}).addTo(map);
let lastPoint='',lastBounds='';
function cell(lat,lon,value){
  const valid=typeof value==='number'&&Number.isFinite(value);
  const hue=120*(1-Math.min(1,Math.max(0,(value||0)/2.5)));
  return L.rectangle([[lat-.125,lon-.125],[lat+.125,lon+.125]],{
    color:valid?'#ffffff':'#198d98',weight:valid?.6:.8,
    fillColor:valid?`hsl(${hue} 72% 48%)`:'transparent',
    fillOpacity:valid?.55:0,interactive:false
  }).addTo(grid);
}
window.fireSky={update(state){
  const {lat,lon,west,east,south,north,regional,points}=state;
  const point=`${lat},${lon}`,bounds=`${west},${east},${south},${north},${regional}`;
  pin.setLatLng([lat,lon]);grid.clearLayers();
  if(regional&&east>west&&north>south){
    if(bounds!==lastBounds)map.fitBounds([[south,west],[north,east]],{padding:[35,35]});
    const nx=Math.floor((east-west)/.25)+1,ny=Math.floor((north-south)/.25)+1;
    const style={color:'#198d98',weight:.8,interactive:false};
    for(let y=0;y<=ny;y++)L.polyline([[south-.125+y*.25,west-.125],[south-.125+y*.25,west+nx*.25-.125]],style).addTo(grid);
    for(let x=0;x<=nx;x++)L.polyline([[south-.125,west-.125+x*.25],[south+ny*.25-.125,west-.125+x*.25]],style).addTo(grid);
  }else if(point!==lastPoint||bounds!==lastBounds)map.setView([lat,lon],14);
  if(Array.isArray(points))for(const p of points){
    if(Number.isFinite(p.lat)&&Number.isFinite(p.lon))cell(p.lat,p.lon,p.peak_quality_index??p.quality_index);
  }
  lastPoint=point;lastBounds=bounds;
}};
map.on('click',e=>window.chrome?.webview?.postMessage({type:'point',lat:e.latlng.lat,lon:e.latlng.lng}));
window.chrome?.webview?.postMessage({type:'ready'});
</script>
</body>
</html>
