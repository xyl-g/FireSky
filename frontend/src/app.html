<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="FireSky：朝霞晚霞物理预测、卫星实况与形势图。" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="theme-color" content="#f6f2ea" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- leaflet.css 随地图组件按需加载（见 MapView/OutdoorForecastMap 等），不再全局阻塞首屏 -->
    <title>FireSky</title>
    <script>
      // 主题初始化 + 液态玻璃折射检测（仅 Chromium 支持 backdrop-filter: url(#svg)）
      const storedTheme = localStorage.getItem('mode-watcher-mode') || localStorage.getItem('theme') || localStorage.getItem('mode');
      if (!localStorage.getItem('mode-watcher-mode') && (storedTheme === 'dark' || storedTheme === 'light')) {
        localStorage.setItem('mode-watcher-mode', storedTheme);
      }
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const mode = storedTheme === 'dark' || storedTheme === 'light' ? storedTheme : (prefersDark ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', mode === 'dark');
      if (/\s(Chrome|Chromium|Edg)\/\d+/.test(navigator.userAgent) && !/iPhone|iPad/.test(navigator.userAgent)) {
        document.documentElement.classList.add('chromium-glass');
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
