[package]
name = "firesky-native"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "firesky_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = "1.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
