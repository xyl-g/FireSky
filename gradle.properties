# 仓库根 Gradle 门禁入口的构建属性——与 apps/mobile-android/gradle.properties 保持一致。
# Gradle 只从「构建根目录」（此处为 worktree 根）读取 gradle.properties；
# cwd 位于 apps/mobile-android 内时读取的是该目录的同名文件。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
