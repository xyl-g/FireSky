name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: pytest（引擎不变量 + 后端契约）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 安装依赖（含 nowcast/ec extras）
        run: pip install -e ".[dev,cams,nowcast,ec]"
      - name: 构建原生评分器
        run: ./scripts/build_native_variants.sh
      - name: 构建独立 Rust 引擎
        run: cargo build --manifest-path engine/Cargo.toml --release --locked
      - name: pytest
        env:
          FIRESKY_REQUIRE_RUST_TESTS: "1"
          FIRESKY_RUST_ENGINE_BIN: ${{ github.workspace }}/engine/target/release/firesky-engine
        run: python -m pytest tests/ -q

  rust:
    name: cargo test（native + Python-free runtime）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native
            engine
      - name: cargo test
        working-directory: native
        run: cargo test --release --locked
      - name: Build and test native runtime
        run: cargo test --manifest-path engine/Cargo.toml --locked

  frontend:
    name: svelte-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: svelte-check
        working-directory: frontend
        run: npm run check
      - name: build
        working-directory: frontend
        run: npm run build
      - name: Native contract tests
        working-directory: frontend
        run: npm run test:contracts


  desktop:
    name: SwiftUI + Rust bundle
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native application bundle
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install eccodes
          bash scripts/build_macos_native.sh
      - name: macOS FFI bundle smoke
        run: |
          FIRESKY_EXPECTED_ARCH="$(uname -m)" \
          FIRESKY_CLEAN_MACHINE_SMOKE=1 \
          FIRESKY_APP_SMOKE=1 \
            bash scripts/test_macos_native.sh
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: FireSky-macos-native
          path: |
            dist/native-macos/*.app

  docker:
    name: docker build（三阶段镜像）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（不推送）
        run: docker build -f docker/Dockerfile -t firesky:ci .
