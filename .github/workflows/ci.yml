name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: pytest（引擎不变量 + 后端契约）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 安装依赖（含 nowcast/ec extras）
        run: pip install -e ".[dev,cams,nowcast,ec]"
      - name: 构建原生评分器
        run: ./scripts/build_native_variants.sh
      - name: pytest
        run: python -m pytest tests/ -q

  rust:
    name: cargo test（native 契约）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: cargo test
        working-directory: native
        run: cargo test --release --locked

  frontend:
    name: svelte-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: svelte-check
        working-directory: frontend
        run: npm run check
      - name: build
        working-directory: frontend
        run: npm run build


  desktop:
    name: desktop bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: FireSky-macos
          - os: windows-latest
            artifact: FireSky-windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 安装模型核心依赖（桌面版不含 nowcast/卫星栈）
        run: pip install -e ".[dev,cams,ec]" PySide6 pyinstaller
      - name: 构建原生评分器
        run: ./scripts/build_native_variants.sh
        shell: bash
      - name: PyInstaller 打包
        run: pyinstaller desktop/FireSky.spec --noconfirm
      - name: macOS → dmg
        if: runner.os == 'macOS'
        run: |
          cd dist
          hdiutil create -volname FireSky -srcfolder FireSky -ov -format UDZO FireSky-macos.dmg
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/FireSky-macos.dmg
            dist/FireSky/

  docker:
    name: docker build（三阶段镜像）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（不推送）
        run: docker build -f docker/Dockerfile -t firesky:ci .
