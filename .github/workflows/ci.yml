name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-contracts:
    name: pytest（现架构契约：Rust IPC + Swift UI）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装测试依赖（仅 pytest/numpy，无产品 Python 运行时）
        run: pip install pytest numpy
      - name: 构建独立 Rust 引擎
        run: cargo build --manifest-path engine/Cargo.toml --release --locked
      - name: pytest
        env:
          FIRESKY_REQUIRE_RUST_TESTS: "1"
          FIRESKY_RUST_ENGINE_BIN: ${{ github.workspace }}/engine/target/release/firesky-engine
        run: python -m pytest tests/ -q

  rust:
    name: cargo test（引擎 + 并入的评分核心，Python-free runtime）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
      # GRIB 解码单测（cams_cache / desktop_context 地形 / ecmwf 日界线 /
      # desktop_preflight）需要真实的 ecCodes 库与定义表；ubuntu runner 默认
      # 不带，缺库时这些测试会 panic。definitions 在独立的 libeccodes-data 包。
      - name: Install ecCodes (library + definitions for decode unit tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeccodes-dev libeccodes-data
      - name: Build and test native runtime
        env:
          FIRESKY_ECCODES_LIBRARY: libeccodes.so.0
          ECCODES_DEFINITION_PATH: /usr/share/eccodes/definitions
          ECCODES_SAMPLES_PATH: /usr/share/eccodes/samples
        run: cargo test --manifest-path engine/Cargo.toml --locked

  cargo-deny:
    # 依赖供应链审计：RustSec 公告 / 重复与封禁 crate / 许可 / 来源。
    # 策略与豁免理由见仓库根 deny.toml 与 docs/OPEN_SOURCE_ADOPTION_PLAN.zh-CN.md P0-1。
    name: cargo deny（Rust 依赖审计）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check（engine）
        run: cargo deny --manifest-path engine/Cargo.toml --config deny.toml check advisories bans licenses sources

  frontend:
    # 2026-11-13：产品共享 Web 统一为 apps/shared-web（Docker/Rust HTTP 同源）。
    # 旧 frontend/（SvelteKit）待合并，其契约测试保留为独立轻量 job。
    name: shared-web check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 与 docker/Dockerfile 的 node:22 基准对齐；node --test 直接导入
          # src/lib/*.ts 依赖 22.18+ 默认开启的类型剥离（Node 20 报
          # ERR_UNKNOWN_FILE_EXTENSION）。
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/shared-web/package-lock.json
      - name: npm ci
        working-directory: apps/shared-web
        run: npm ci --no-audit --no-fund
      - name: svelte-check
        working-directory: apps/shared-web
        run: npm run check
      - name: node tests (ipc/display/scripts)
        working-directory: apps/shared-web
        run: npm test
      - name: build
        working-directory: apps/shared-web
        run: npm run build

  frontend-legacy-contracts:
    name: legacy frontend/ contract tests (pending merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      # 契约测试经 vite ModuleRunner 加载 TS，tsconfig extends
      # ./.svelte-kit/tsconfig.json；干净 checkout 上必须先 sync 生成。
      - name: svelte-kit sync
        working-directory: frontend
        run: npx svelte-kit sync
      - name: Native contract tests
        working-directory: frontend
        run: npm run test:contracts


  desktop:
    name: SwiftUI + Rust bundle
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native application bundle
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # ripgrep: test_macos_native.sh 的契约 grep 依赖 rg；macos-26 镜像未预装。
          brew install eccodes ripgrep
          bash scripts/build_macos_native.sh
      - name: macOS FFI bundle smoke
        run: |
          FIRESKY_EXPECTED_ARCH="$(uname -m)" \
          FIRESKY_CLEAN_MACHINE_SMOKE=1 \
          FIRESKY_APP_SMOKE=1 \
            bash scripts/test_macos_native.sh
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: FireSky-macos-native
          path: |
            dist/native-macos/*.app
            dist/native-macos/*.dmg

  docker:
    name: docker build（三阶段镜像）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（不推送）
        run: docker build -f docker/Dockerfile -t firesky:ci .

  android-native:
    name: Android Compose（unit tests，Mock 链）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu runner 预装 Android SDK（ANDROID_HOME + licenses 已接受）；
      # FIRESKY_SKIP_NATIVE=1 跳过 JNI/交叉库链（CI 无 NDK + ecCodes 交叉库），
      # 只验证 Kotlin 编译与 MockTransport 全链单元测试。
      - name: Kotlin 编译 + 单元测试（MockTransport 全链契约）
        env:
          FIRESKY_SKIP_NATIVE: "1"
        run: |
          cd apps/mobile-android
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon

  ios-native:
    name: iOS SwiftUI + engine-mobile（simulator tests）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - name: 构建模拟器 ecCodes/libaec 交叉静态库
        run: |
          ROOT="$PWD/.cache/mm0-cross"
          mkdir -p "$ROOT" && cd "$ROOT"
          curl -fL -sS -o eccodes.tar.gz             "https://codeload.github.com/ECMWF/eccodes/tar.gz/refs/tags/2.50.0"
          tar xzf eccodes.tar.gz
          mv "$(find . -maxdepth 1 -type d -name 'eccodes-*' | head -n 1)" eccodes-src
          curl -fL -sS -o libaec.tar.gz             "https://github.com/Deutsches-Klimarechenzentrum/libaec/releases/download/v1.1.8/libaec-1.1.8.tar.gz"
          tar xzf libaec.tar.gz
          mv "$(find . -maxdepth 1 -type d -name 'libaec-*' | head -n 1)" libaec-src
          DEV="$(xcode-select -p)"
          SIM_SDK="$DEV/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk"
          XC="$DEV/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
          J="$(sysctl -n hw.ncpu)"
          cmake -S libaec-src -B build-libaec-ios-sim \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_SYSROOT="$SIM_SDK" \
            -DCMAKE_C_COMPILER="$XC" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_STATIC_LIBS=ON -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$ROOT/build-ios-sim/aec"
          cmake --build build-libaec-ios-sim -j "$J"
          cmake --install build-libaec-ios-sim
          mkdir -p build-ios-sim/lib
          cp build-ios-sim/aec/lib/libaec.a build-ios-sim/lib/libaec.a
          COMMON=(-DDISABLE_OS_CHECK=ON -DIEEE_LE=1 -DIEEE_BE=0
                  -DENABLE_BUILD_TOOLS=OFF -DCMAKE_MACOSX_BUNDLE=OFF -DENABLE_AEC=ON
                  -DENABLE_USE_SHARED_LIB_AEC=OFF
                  -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64
                  -DCMAKE_C_COMPILER="$XC" -DCMAKE_CXX_COMPILER="$XC++"
                  -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
                  -DENABLE_FORTRAN=OFF -DENABLE_PYTHON=OFF -DENABLE_TESTS=OFF -DENABLE_EXAMPLES=OFF
                  -DENABLE_TOOLS=OFF -DENABLE_NETCDF=OFF -DENABLE_OPENMP=OFF -DENABLE_PNG=OFF -DENABLE_JPEG=OFF)
          cmake -S eccodes-src -B build-ios-sim "${COMMON[@]}" -DCMAKE_OSX_SYSROOT="$SIM_SDK" \
            -DCMAKE_PREFIX_PATH="$PWD/build-ios-sim/aec" \
            -Dlibaec_DIR="$PWD/build-ios-sim/aec/lib/cmake/libaec"
          cmake --build build-ios-sim -j "$J"
          mkdir -p build-ios-sim/lib
          test -f build-ios-sim/lib/libeccodes.a
      - name: 构建 engine-mobile 模拟器静态库
        env:
          MM0_ECCODES_IOSSIM_LIB: ${{ github.workspace }}/.cache/mm0-cross/build-ios-sim/lib
        run: cargo build --release --target aarch64-apple-ios-sim --manifest-path engine-mobile/Cargo.toml
      - name: XCTest（真引擎模拟器全链 + 单元）
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro)? \([0-9A-F-]+\)' | head -1 | sed 's/ (.*//')
          echo "simulator: $SIM_NAME"
          xcodebuild -project apps/mobile-ios/FireSkyMobile.xcodeproj -scheme FireSkyMobile \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -resultBundlePath /tmp/firesky-ios.xcresult test CODE_SIGNING_ALLOWED=NO | tail -30
