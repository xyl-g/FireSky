name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 连续 push / PR 更新时取消同分支旧 run，释放 runner（审计 P0-1）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      engine: ${{ steps.filter.outputs.engine }}
      tests_py: ${{ steps.filter.outputs.tests_py }}
      shared_web: ${{ steps.filter.outputs.shared_web }}
      macos: ${{ steps.filter.outputs.macos }}
      docker: ${{ steps.filter.outputs.docker }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'resources/**'
              - 'docker/**'
              - 'docker-compose.yaml'
              - 'apps/windows/**'
              - 'apps/shared/**'
              - 'apps/shared-web/**'
              - 'scripts/**'
              - '.github/workflows/**'
            engine:
              - 'engine/**'
              - 'resources/**'
              - 'deny.toml'
              - 'scripts/build_rust_engine.sh'
              - 'scripts/build_app_resources.py'
              - 'scripts/prune_eccodes_definitions.sh'
            tests_py:
              - 'tests/**'
              - 'engine/**'
              - 'apps/macos/**'
              - 'apps/shared/**'
              - 'resources/**'
              - 'scripts/test_macos_*.sh'
            shared_web:
              - 'apps/shared-web/**'
              - 'apps/shared/**'
            macos:
              - 'apps/macos/**'
              - 'apps/shared/**'
              - 'engine/**'
              - 'resources/**'
              - 'scripts/build_macos_native.sh'
              - 'scripts/bundle_macos_eccodes.sh'
              - 'scripts/prune_eccodes_definitions.sh'
              - 'scripts/test_macos_native.sh'
              - 'scripts/test_macos_swift_fixtures.sh'
              - 'scripts/smoke_macos_ffi.*'
            docker:
              - 'docker/**'
              - 'docker-compose.yaml'
              - 'engine/**'
              - 'apps/shared-web/**'
              - 'apps/shared/**'
              - 'resources/**'
              - 'scripts/test_docker_contract.sh'
            android:
              - 'apps/mobile-android/**'
            ios:
              - 'apps/mobile-ios/**'

  contracts:
    name: Native resource & FFI contracts
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # 契约脚本（test_docker_contract.sh / test_windows_ffi_contract.sh）用 rg；
      # ubuntu-24.04 镜像未预装 ripgrep。
      - name: Install ripgrep for contract scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - name: Verify immutable application resources
        run: python3 scripts/build_app_resources.py --root resources/app-data --check
      - name: Verify Docker runtime contract
        run: bash scripts/test_docker_contract.sh
      - name: Verify Windows FFI adapter contract
        run: bash scripts/test_windows_ffi_contract.sh
      - run: node --test apps/shared-web/scripts/*.test.mjs

  native-contracts:
    name: pytest（现架构契约：Rust IPC + Swift UI）
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.tests_py == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: 安装测试依赖（仅 pytest/numpy，无产品 Python 运行时）
        run: pip install pytest numpy
      - name: 构建独立 Rust 引擎
        run: cargo build --manifest-path engine/Cargo.toml --release --locked
      - name: pytest
        env:
          FIRESKY_REQUIRE_RUST_TESTS: "1"
          FIRESKY_RUST_ENGINE_BIN: ${{ github.workspace }}/engine/target/release/firesky-engine
        run: python -m pytest tests/ -q

  rust:
    timeout-minutes: 45
    name: cargo test（引擎 + 并入的评分核心，Python-free runtime）
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
      # GRIB 解码单测（cams_cache / desktop_context 地形 / ecmwf 日界线 /
      # desktop_preflight）需要真实的 ecCodes 库与定义表；ubuntu runner 默认
      # 不带，缺库时这些测试会 panic。definitions 在独立的 libeccodes-data 包。
      - name: Install ecCodes (library + definitions for decode unit tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeccodes-dev libeccodes-data
      - name: Build and test native runtime
        env:
          FIRESKY_ECCODES_LIBRARY: libeccodes.so.0
          ECCODES_DEFINITION_PATH: /usr/share/eccodes/definitions
          ECCODES_SAMPLES_PATH: /usr/share/eccodes/samples
        run: cargo test --manifest-path engine/Cargo.toml --locked

  cargo-deny:
    # 依赖供应链审计：RustSec 公告 / 重复与封禁 crate / 许可 / 来源。
    # 策略与豁免理由见仓库根 deny.toml 与 docs/OPEN_SOURCE_ADOPTION_PLAN.zh-CN.md P0-1。
    name: cargo deny（Rust 依赖审计）
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check（engine）
        run: cargo deny --manifest-path engine/Cargo.toml --config deny.toml check advisories bans licenses sources

  frontend:
    timeout-minutes: 15
    # 2026-11-13：产品共享 Web 统一为 apps/shared-web（Docker/Rust HTTP 同源）。
    # 旧 frontend/（SvelteKit）待合并，其契约测试保留为独立轻量 job。
    name: shared-web check + build
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.shared_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 与 docker/Dockerfile 的 node:22 基准对齐；node --test 直接导入
          # src/lib/*.ts 依赖 22.18+ 默认开启的类型剥离（Node 20 报
          # ERR_UNKNOWN_FILE_EXTENSION）。
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/shared-web/package-lock.json
      - name: npm ci
        working-directory: apps/shared-web
        run: npm ci --no-audit --no-fund
      - name: svelte-check
        working-directory: apps/shared-web
        run: npm run check
      - name: node tests (ipc/display/scripts)
        working-directory: apps/shared-web
        run: npm test
      - name: build
        working-directory: apps/shared-web
        run: npm run build

  desktop:
    timeout-minutes: 45
    name: SwiftUI + Rust bundle
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Native application bundle
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # ripgrep: test_macos_native.sh 的契约 grep 依赖 rg；macos-26 镜像未预装。
          brew install eccodes ripgrep
          bash scripts/build_macos_native.sh
      - name: macOS FFI bundle smoke
        run: |
          FIRESKY_EXPECTED_ARCH="$(uname -m)" \
          FIRESKY_CLEAN_MACHINE_SMOKE=1 \
          FIRESKY_APP_SMOKE=1 \
            bash scripts/test_macos_native.sh
      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: FireSky-macos-native
          path: |
            dist/native-macos/*.app
            dist/native-macos/*.dmg

  docker:
    timeout-minutes: 25
    name: docker build（三阶段镜像）
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 构建镜像（不推送）
        run: docker build -f docker/Dockerfile -t firesky:ci .

  android-native:
    name: Android Compose（thin-client 编译与单元测试）
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Kotlin 编译 + 单元测试（含 androidTest 编译）
        run: |
          cd apps/mobile-android
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin --no-daemon

  ios-native:
    timeout-minutes: 30
    name: iOS SwiftUI（thin-client simulator tests）
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: XCTest（模拟器单元与 UI 契约）
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro)? \([0-9A-F-]+\)' | head -1 | sed 's/ (.*//')
          echo "simulator: $SIM_NAME"
          xcodebuild -project apps/mobile-ios/FireSkyMobile.xcodeproj -scheme FireSkyMobile \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -resultBundlePath /tmp/firesky-ios.xcresult test CODE_SIGNING_ALLOWED=NO
