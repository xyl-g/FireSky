name: Native Desktop

on:
  push:
    branches: [main]
    # v* tag 触发自动发布（release job）。paths 过滤只保留在 PR 上：
    # tag push 没有可靠的变更文件列表，paths 过滤可能把 tag 触发整个挡掉。
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/**"
      - "engine/**"
      - "resources/**"
      - "scripts/build_app_resources.py"
      - "scripts/bundle_macos_eccodes.sh"
      - "scripts/test_macos_native.sh"
      - "scripts/test_macos_swift_fixtures.sh"
      - "scripts/test_docker_contract.sh"
      - "docker/Dockerfile"
      - ".github/workflows/native-desktop.yml"
  workflow_dispatch:

jobs:
  contracts:
    name: Native resource contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 契约脚本（test_docker_contract.sh / test_windows_ffi_contract.sh）用 rg；
      # ubuntu-24.04 镜像未预装 ripgrep。
      - name: Install ripgrep for contract scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - name: Verify immutable application resources
        run: python3 scripts/build_app_resources.py --root resources/app-data --check
      - name: Verify Docker runtime contract
        run: bash scripts/test_docker_contract.sh
      - name: Verify Windows FFI adapter contract
        run: bash scripts/test_windows_ffi_contract.sh
      - run: node --test apps/shared-web/scripts/*.test.mjs

  linux-native:
    name: Linux GTK4 + Rust FFI
    # 2026-11-20 临时停用：Linux 已降级为非发布目标，当前无法判断可用性（用户裁定）。
    if: false
    # Linux follows the macOS ABI and lifecycle baseline; do not fan out
    # platform UI builds before the macOS gate has passed.
    needs: macos-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK4 and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake pkg-config libgtk-4-dev
      - name: Build Rust FFI shared library
        run: cargo build --manifest-path engine/Cargo.toml --release --locked --lib
      - name: Configure and build Linux native targets
        run: |
          cmake -S apps/linux -B build/linux-ffi \
            -DCMAKE_BUILD_TYPE=Release \
            -DFIRESKY_BUILD_GTK_UI=ON
          cmake --build build/linux-ffi --parallel
          test -x build/linux-ffi/firesky_linux_native
      - name: Run Linux FFI hello smoke
        env:
          FIRESKY_RESOURCE_DIR: ${{ github.workspace }}/resources/app-data
          FIRESKY_REQUIRE_APP_RESOURCES: "1"
        run: |
          build/linux-ffi/firesky_linux_ffi_smoke \
            "$PWD/engine/target/release/libfiresky_engine.so" "$PWD"

  macos-native:
    # Build and smoke-test the actual SwiftUI + Rust FFI app on both required
    # macOS architectures.
    name: SwiftUI + Rust FFI ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    needs: contracts
    env:
      FIRESKY_MACOS_ARCH: ${{ matrix.arch }}
      FIRESKY_EXPECTED_ARCH: ${{ matrix.arch }}
      FIRESKY_APP_SMOKE: "1"
      FIRESKY_CLEAN_MACHINE_SMOKE: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install ecCodes
        # ripgrep: test_macos_native.sh 的契约 grep 依赖 rg；macos-26 镜像未预装。
        run: brew install eccodes ripgrep
      - name: Build native app
        run: bash scripts/build_macos_native.sh
      - name: FFI bundle smoke
        run: bash scripts/test_macos_native.sh
      - name: Upload native app
        uses: actions/upload-artifact@v4
        with:
          name: FireSky-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/native-macos/*.app
            dist/native-macos/*.dmg

  windows-native:
    # Windows follows the macOS ABI baseline. This builds the actual WinUI
    # client and Rust DLL for both required Windows architectures.
    name: WinUI + Rust FFI ${{ matrix.arch }}
    # 2026-11-20 临时停用：Windows 发布延后，当前无法判断可用性（用户裁定）。
    if: false
    needs: macos-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
            platform: x64
            rid: win-x64
            target: x86_64-pc-windows-msvc
            triplet: x64-windows
          - runner: windows-11-arm
            arch: arm64
            platform: ARM64
            rid: win-arm64
            target: aarch64-pc-windows-msvc
            triplet: arm64-windows
    runs-on: ${{ matrix.runner }}
    env:
      FIRESKY_RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Windows ecCodes bundle
        shell: pwsh
        env:
          VCPKG_TRIPLET: ${{ matrix.triplet }}
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg clone failed" }
          git -C "$env:RUNNER_TEMP/vcpkg" checkout 2ec0f1747d8186a5c9babe276e2ad57cd2b12d2a
          if ($LASTEXITCODE -ne 0) { throw "vcpkg checkout failed" }
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          & "$env:RUNNER_TEMP/vcpkg/vcpkg.exe" install "eccodes[aec,png]:$env:VCPKG_TRIPLET" --classic
          if ($LASTEXITCODE -ne 0) { throw "ecCodes build failed" }
          node apps/shared-web/scripts/bundle-vcpkg-eccodes.mjs `
            "$env:RUNNER_TEMP/vcpkg/installed" `
            "$env:RUNNER_TEMP/vcpkg/ports" `
            "$env:VCPKG_TRIPLET" `
            "$env:RUNNER_TEMP/eccodes-bundle"
          if ($LASTEXITCODE -ne 0) { throw "ecCodes bundle failed" }
      - name: Build WinUI native app
        shell: pwsh
        env:
          # runner context is only valid at step level; a job-level env with
          # runner.temp makes GitHub reject the whole workflow at startup.
          FIRESKY_ECCODES_ROOT: ${{ runner.temp }}\eccodes-bundle
        run: |
          dotnet build apps/windows/FireSky/FireSky.csproj `
            -c Release `
            -p:Platform=${{ matrix.platform }} `
            -r ${{ matrix.rid }} `
            -p:FireSkyEcCodesRoot="$env:FIRESKY_ECCODES_ROOT" `
            --self-contained true
      - name: Verify FFI payload
        shell: pwsh
        run: |
          # -p:Platform=x64/ARM64 时 .NET SDK 输出在 bin\<Platform>\Release\，
          # WinUI 再叠加 net8.0-…\win10-<arch>\ 层级；不会落在 bin\Release。
          $root = "apps/windows/FireSky/bin"
          if (!(Test-Path $root)) { throw "build output root was not produced: $root" }
          $exe = Get-ChildItem $root -Recurse -Filter "FireSky.exe" |
            Where-Object { Test-Path (Join-Path $_.Directory.FullName "Resources\firesky_engine.dll") } |
            Select-Object -First 1
          if ($null -eq $exe) { throw "FireSky.exe with packaged firesky_engine.dll was not produced" }
          $dll = Join-Path $exe.Directory.FullName "Resources\firesky_engine.dll"
          if (!(Test-Path $dll)) { throw "firesky_engine.dll was not packaged" }
          $manifest = Join-Path $exe.Directory.FullName "Resources\app-data\RESOURCE-MANIFEST.json"
          if (!(Test-Path $manifest)) { throw "application resource manifest was not packaged" }
          if ((Get-ChildItem $exe.Directory.FullName -Recurse -Include "*python*","*pyside*","*pyobjc*").Count -gt 0) {
            throw "Python runtime files found in native package"
          }
      - name: Upload WinUI native package
        uses: actions/upload-artifact@v4
        with:
          name: FireSky-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: apps/windows/FireSky/bin/**

  linux-ffi:
    # Linux currently verifies the shared native FFI foundation. The full
    # toolkit UI and installer remain a follow-up after this contract gate.
    name: Linux FFI ${{ matrix.arch }}
    # 2026-11-20 临时停用：随 linux-native/windows-native 一并关闭（用户裁定）。
    if: false
    needs: windows-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux C++ FFI smoke
        run: bash scripts/test_linux_ffi.sh

  docker:
    name: Docker ${{ matrix.platform }} build and runtime smoke
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: docker/setup-buildx-action@v3
      - name: Build and load the actual target image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: firesky:ci-${{ matrix.architecture }}
      - name: Verify image platform, start Rust service, and smoke shared SPA
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(docker image inspect firesky:ci-${EXPECTED_ARCH} --format '{{.Architecture}}')" = "${EXPECTED_ARCH}"
          docker volume create firesky-smoke-state
          docker run -d --name firesky-smoke -v firesky-smoke-state:/data/state -p 127.0.0.1:18765:8765 firesky:ci-${EXPECTED_ARCH}
          test "$(docker exec firesky-smoke uname -m)" = "${EXPECTED_MACHINE}"
          docker exec firesky-smoke sh -c '! command -v python && ! command -v python3'
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18765/api/v1/firesky/health > /dev/null; then break; fi
            sleep 1
          done
          docker exec firesky-smoke sh -c 'test "$FIRESKY_TASK_HISTORY_DIR" = /data/state/tasks'
          docker exec firesky-smoke test -w /data/state/tasks
          docker exec firesky-smoke test -d /data/state/tasks/jobs
          docker exec firesky-smoke test -d /data/state/tasks/owners
          umask 077
          docker cp firesky-smoke:/data/state/http-token "${RUNNER_TEMP}/firesky-http-token"
          export FIRESKY_HTTP_TOKEN_FILE="${RUNNER_TEMP}/firesky-http-token"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18765/api/v1/firesky/desktop/status)" = 401
          node apps/shared-web/scripts/smoke-http-runtime.mjs http://127.0.0.1:18765 --history-seed "${RUNNER_TEMP}/firesky-history-smoke.json"
          docker rm -f firesky-smoke
          docker run -d --name firesky-smoke -v firesky-smoke-state:/data/state -p 127.0.0.1:18765:8765 firesky:ci-${EXPECTED_ARCH}
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18765/api/v1/firesky/health > /dev/null; then break; fi
            sleep 1
          done
          docker cp firesky-smoke:/data/state/http-token "${RUNNER_TEMP}/firesky-http-token-restored"
          cmp "${RUNNER_TEMP}/firesky-http-token" "${RUNNER_TEMP}/firesky-http-token-restored"
          node apps/shared-web/scripts/smoke-http-runtime.mjs http://127.0.0.1:18765 --history-verify "${RUNNER_TEMP}/firesky-history-smoke.json"
      - name: Capture container diagnostics
        if: always()
        run: docker logs firesky-smoke
      - name: Stop smoke container
        if: always()
        run: docker rm -f firesky-smoke
      - name: Remove smoke state volume
        if: always()
        run: docker volume rm -f firesky-smoke-state

  release:
    name: Publish GitHub Release
    # 打 v* tag 时自动发布：macOS 双架构 DMG 取自本 run 的矩阵产物，
    # 不再需要本地下载/上传。移动端/Docker 资产仍按 README 口径另行补齐。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos-native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: FireSky-macos-arm64
          path: artifacts/arm64
      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: FireSky-macos-x86_64
          path: artifacts/x86_64
      - name: Stage DMGs and SHA256SUMS
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          find artifacts -name '*.dmg' -exec cp {} release-assets/ \;
          # 资产文件名必须带 tag 版本，防止旧版本产物混入。
          for arch in arm64 x86_64; do
            test -f "release-assets/FireSky-${VERSION}-macos-${arch}.dmg"
          done
          (cd release-assets && sha256sum FireSky-*.dmg > SHA256SUMS.txt)
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
      - name: Extract changelog section for this version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" \
            'index($0, "## v" ver " ") == 1 {f=1; next} /^## v/ {f=0} f' \
            CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "CHANGELOG 缺少 v${VERSION} 段落，请先补齐再打 tag。" >&2
            exit 1
          fi
      - name: Create GitHub Release (skip if already published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "FireSky $GITHUB_REF_NAME" \
            --notes-file release-body.md \
            release-assets/*
