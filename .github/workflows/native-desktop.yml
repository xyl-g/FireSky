name: Native Desktop

on:
  push:
    branches: [main]
    # v* tag 触发自动发布（release job）。paths 过滤只保留在 PR 上：
    # tag push 没有可靠的变更文件列表，paths 过滤可能把 tag 触发整个挡掉。
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/**"
      - "engine/**"
      - "resources/**"
      - "scripts/build_app_resources.py"
      - "scripts/bundle_macos_eccodes.sh"
      - "scripts/build_windows_native.ps1"
      - "scripts/test_macos_native.sh"
      - "scripts/test_macos_swift_fixtures.sh"
      - "scripts/test_docker_contract.sh"
      - "docker/Dockerfile"
      - ".github/workflows/native-desktop.yml"
  workflow_dispatch:

# 并发控制（审计 P0-1）：main push 用 ref 组可取消旧 run；tag 发布用
# 独立组——同 tag 重打取消旧 run，不同 tag 互不干扰。
concurrency:
  group: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && format('release-{0}', github.ref_name) || format('native-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Native resource contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 契约脚本（test_docker_contract.sh / test_windows_ffi_contract.sh）用 rg；
      # ubuntu-24.04 镜像未预装 ripgrep。
      - name: Install ripgrep for contract scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - name: Verify immutable application resources
        run: python3 scripts/build_app_resources.py --root resources/app-data --check
      - name: Verify Docker runtime contract
        run: bash scripts/test_docker_contract.sh
      - name: Verify Windows FFI adapter contract
        run: bash scripts/test_windows_ffi_contract.sh
      - run: node --test apps/shared-web/scripts/*.test.mjs

  macos-native:
    needs: contracts
    timeout-minutes: 90
    # Build and smoke-test the actual SwiftUI + Rust FFI app on both required
    # macOS architectures.
    name: SwiftUI + Rust FFI ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      FIRESKY_MACOS_ARCH: ${{ matrix.arch }}
      FIRESKY_EXPECTED_ARCH: ${{ matrix.arch }}
      FIRESKY_APP_SMOKE: "1"
      FIRESKY_CLEAN_MACHINE_SMOKE: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install ecCodes
        # ripgrep: test_macos_native.sh 的契约 grep 依赖 rg；macos-26 镜像未预装。
        run: brew install eccodes ripgrep
      - name: Build native app
        run: bash scripts/build_macos_native.sh
      - name: FFI bundle smoke
        run: bash scripts/test_macos_native.sh
      - name: Upload native app
        uses: actions/upload-artifact@v4
        with:
          name: FireSky-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/native-macos/*.app
            dist/native-macos/*.dmg

  windows-native:
    # P0-3：与 macos-native 并行（无数据依赖，只消费 contracts 与自身产物）；
    # 此前文件里出现两个 needs 键（contracts/macos-native），YAML 后值覆盖
    # 前值导致并行改造静默失效——本 run 起合并为单一 needs。
    needs: contracts
    timeout-minutes: 90
    # Windows follows the macOS ABI baseline. This builds the actual WinUI
    # client and Rust DLL for both required Windows architectures, and stages
    # the release zip via scripts/build_windows_native.ps1 (same path as local
    # builds). 2026-11-21 恢复：Windows 原生链已在真实 Windows 机器上完成
    # 构建/运行冒烟（feat/windows-release）。
    name: WinUI + Rust FFI ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
            rid: win-x64
            target: x86_64-pc-windows-msvc
            triplet: x64-windows
          # Cross-build ARM64 from x64 so vcpkg host tools (notably Python)
          # use the x64 compiler instead of exhausting the ARM runner heap.
          - runner: windows-2022
            arch: arm64
            rid: win-arm64
            target: aarch64-pc-windows-msvc
            triplet: arm64-windows
    runs-on: ${{ matrix.runner }}
    env:
      FIRESKY_RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Windows ecCodes bundle
        shell: pwsh
        env:
          VCPKG_TRIPLET: ${{ matrix.triplet }}
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg clone failed" }
          git -C "$env:RUNNER_TEMP/vcpkg" checkout 2ec0f1747d8186a5c9babe276e2ad57cd2b12d2a
          if ($LASTEXITCODE -ne 0) { throw "vcpkg checkout failed" }
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          & "$env:RUNNER_TEMP/vcpkg/vcpkg.exe" install "eccodes[aec,png]:$env:VCPKG_TRIPLET" --classic
          if ($LASTEXITCODE -ne 0) { throw "ecCodes build failed" }
          node apps/shared-web/scripts/bundle-vcpkg-eccodes.mjs `
            "$env:RUNNER_TEMP/vcpkg/installed" `
            "$env:RUNNER_TEMP/vcpkg/ports" `
            "$env:VCPKG_TRIPLET" `
            "$env:RUNNER_TEMP/eccodes-bundle"
          if ($LASTEXITCODE -ne 0) { throw "ecCodes bundle failed" }
      - name: Build and package WinUI native app
        shell: pwsh
        run: |
          # 打包脚本复用本 job 已构建的 ecCodes bundle；引擎与 WinUI 构建、
          # 载荷校验、清理暂存与 zip+sha256 都走与本地一致的单一路径。
          pwsh -ExecutionPolicy Bypass -File scripts/build_windows_native.ps1 `
            -Arch ${{ matrix.arch }} `
            -EccodesRoot "$env:RUNNER_TEMP\eccodes-bundle"
      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          pwsh -ExecutionPolicy Bypass -File scripts/build_windows_installer.ps1 `
            -Arch ${{ matrix.arch }}
      - name: Upload WinUI native package
        uses: actions/upload-artifact@v4
        with:
          name: FireSky-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/native-windows/*.zip
            dist/native-windows/*.zip.sha256
            dist/native-windows/*-setup.exe
            dist/native-windows/*-setup.exe.sha256

  docker:
    name: Docker ${{ matrix.platform }} build and runtime smoke
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: docker/setup-buildx-action@v3
      - name: Build and load the actual target image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: firesky:ci-${{ matrix.architecture }}
      - name: Verify image platform, start Rust service, and smoke shared SPA
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(docker image inspect firesky:ci-${EXPECTED_ARCH} --format '{{.Architecture}}')" = "${EXPECTED_ARCH}"
          docker volume create firesky-smoke-state
          docker run -d --name firesky-smoke -v firesky-smoke-state:/data/state -p 127.0.0.1:18765:8765 firesky:ci-${EXPECTED_ARCH}
          test "$(docker exec firesky-smoke uname -m)" = "${EXPECTED_MACHINE}"
          docker exec firesky-smoke sh -c '! command -v python && ! command -v python3'
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18765/api/v1/firesky/health > /dev/null; then break; fi
            sleep 1
          done
          docker exec firesky-smoke sh -c 'test "$FIRESKY_TASK_HISTORY_DIR" = /data/state/tasks'
          docker exec firesky-smoke test -w /data/state/tasks
          docker exec firesky-smoke test -d /data/state/tasks/jobs
          docker exec firesky-smoke test -d /data/state/tasks/owners
          umask 077
          docker cp firesky-smoke:/data/state/http-token "${RUNNER_TEMP}/firesky-http-token"
          export FIRESKY_HTTP_TOKEN_FILE="${RUNNER_TEMP}/firesky-http-token"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18765/api/v1/firesky/desktop/status)" = 401
          node apps/shared-web/scripts/smoke-http-runtime.mjs http://127.0.0.1:18765 --history-seed "${RUNNER_TEMP}/firesky-history-smoke.json"
          docker rm -f firesky-smoke
          docker run -d --name firesky-smoke -v firesky-smoke-state:/data/state -p 127.0.0.1:18765:8765 firesky:ci-${EXPECTED_ARCH}
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18765/api/v1/firesky/health > /dev/null; then break; fi
            sleep 1
          done
          docker cp firesky-smoke:/data/state/http-token "${RUNNER_TEMP}/firesky-http-token-restored"
          cmp "${RUNNER_TEMP}/firesky-http-token" "${RUNNER_TEMP}/firesky-http-token-restored"
          node apps/shared-web/scripts/smoke-http-runtime.mjs http://127.0.0.1:18765 --history-verify "${RUNNER_TEMP}/firesky-history-smoke.json"
      - name: Capture container diagnostics
        if: always()
        run: docker logs firesky-smoke
      - name: Stop smoke container
        if: always()
        run: docker rm -f firesky-smoke
      - name: Remove smoke state volume
        if: always()
        run: docker volume rm -f firesky-smoke-state

  mobile-release:
    timeout-minutes: 20
    name: Android APK（thin-client）
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Gradle wrapper + 依赖缓存：Maven Central 429 限流时命中缓存即过
      # （2026-11-21 v1.9.8 首次发布即因 jsr305.pom 429 失败）。
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build thin-client APK
        run: |
          cd apps/mobile-android
          ./gradlew :app:assembleDebug --no-daemon
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireSky-android
          path: apps/mobile-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-release:
    timeout-minutes: 30
    name: iOS IPA（unsigned thin-client）
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iOS Release .app
        run: |
          set -euo pipefail
          xcodebuild -project apps/mobile-ios/FireSkyMobile.xcodeproj \
            -scheme FireSkyMobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/ios-build/Build/Products/Release-iphoneos/FireSkyMobile.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa-stage/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa-stage/Payload/"
          # Add a standard Ad-Hoc signature slot + CodeResources so sideloaders (AltStore/SideStore/Sideloadly) can re-sign cleanly.
          codesign --force --deep --sign - "$RUNNER_TEMP/ipa-stage/Payload/FireSkyMobile.app"
          otool -l "$RUNNER_TEMP/ipa-stage/Payload/FireSkyMobile.app/FireSkyMobile" | grep -q LC_CODE_SIGNATURE
          (cd "$RUNNER_TEMP/ipa-stage" && zip -qry "$RUNNER_TEMP/FireSky-ios-arm64.ipa" Payload)
          test -s "$RUNNER_TEMP/FireSky-ios-arm64.ipa"
      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireSky-ios
          path: ${{ runner.temp }}/FireSky-ios-arm64.ipa
          if-no-files-found: error

  release:
    timeout-minutes: 15
    name: Publish GitHub Release
    # 打 v* tag 时自动发布：macOS 双架构 DMG、Windows 双架构 zip/setup 与
    # Android/iOS thin-client 资产均取自本 run 的构建产物。
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs['macos-native'].result == 'success' &&
      needs['windows-native'].result == 'success'
    needs: [macos-native, windows-native, mobile-release, ios-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: FireSky-macos-arm64
          path: artifacts/arm64
      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: FireSky-macos-x86_64
          path: artifacts/x86_64
      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: FireSky-windows-x64
          path: artifacts/windows-x64
      - name: Download Windows arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: FireSky-windows-arm64
          path: artifacts/windows-arm64
      - name: Download Android APK artifact
        if: needs['mobile-release'].result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: FireSky-android
          path: artifacts/android
      - name: Download iOS IPA artifact
        if: needs['ios-release'].result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: FireSky-ios
          path: artifacts/ios
      - name: Stage DMGs, zips, installers and SHA256SUMS
        env:
          NEEDS_MOBILE_RELEASE: ${{ needs['mobile-release'].result }}
          NEEDS_IOS_RELEASE: ${{ needs['ios-release'].result }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          find artifacts -name '*.dmg' -exec cp {} release-assets/ \;
          find artifacts \( -name '*.zip' -o -name '*-setup.exe' \) -exec cp {} release-assets/ \;
          # Android APK / iOS IPA 重命名为版本化文件名；对应 job 成功后缺失
          # 视为硬错误（防 artifact 路径变更导致无声少资产）。
          if [ "${NEEDS_MOBILE_RELEASE}" = "success" ]; then
            test -f artifacts/android/app-debug.apk
            cp artifacts/android/app-debug.apk "release-assets/FireSky-${VERSION}-android-arm64.apk"
          fi
          if [ "${NEEDS_IOS_RELEASE}" = "success" ]; then
            test -f artifacts/ios/FireSky-ios-arm64.ipa
            cp artifacts/ios/FireSky-ios-arm64.ipa "release-assets/FireSky-${VERSION}-ios-arm64.ipa"
          fi
          # 资产文件名必须带 tag 版本，防止旧版本产物混入。
          for arch in arm64 x86_64; do
            test -f "release-assets/FireSky-${VERSION}-macos-${arch}.dmg"
          done
          for arch in x64 arm64; do
            test -f "release-assets/FireSky-${VERSION}-windows-${arch}.zip"
            test -f "release-assets/FireSky-${VERSION}-windows-${arch}-setup.exe"
          done
          # APK / IPA 可能缺席（软依赖），哈希分段生成。
          (cd release-assets && sha256sum FireSky-*.dmg FireSky-*.zip FireSky-*-setup.exe > SHA256SUMS.txt)
          if [ "${NEEDS_MOBILE_RELEASE}" = "success" ]; then
            (cd release-assets && sha256sum "FireSky-${VERSION}-android-arm64.apk" >> SHA256SUMS.txt)
          fi
          if [ "${NEEDS_IOS_RELEASE}" = "success" ]; then
            (cd release-assets && sha256sum "FireSky-${VERSION}-ios-arm64.ipa" >> SHA256SUMS.txt)
          fi
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
      - name: Extract changelog section for this version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" \
            'index($0, "## v" ver " ") == 1 {f=1; next} /^## v/ {f=0} f' \
            CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "CHANGELOG 缺少 v${VERSION} 段落，请先补齐再打 tag。" >&2
            exit 1
          fi
      - name: Create GitHub Release (skip if already published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 重打 tag 幂等：已存在则覆盖上传资产（上次 run 资产不全时补齐）。
            echo "Release $GITHUB_REF_NAME already exists; uploading assets with clobber."
            gh release upload "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --clobber release-assets/*
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "FireSky $GITHUB_REF_NAME" \
            --notes-file release-body.md \
            release-assets/*
