name: Native Desktop

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "src/firesky/desktop_*.py"
      - "scripts/build_macos_native.sh"
      - ".github/workflows/native-desktop.yml"
  pull_request:
    paths:
      - "apps/**"
      - "src/firesky/desktop_*.py"
      - "scripts/build_macos_native.sh"
      - ".github/workflows/native-desktop.yml"
  workflow_dispatch:

jobs:
  macos:
    name: SwiftUI compile
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path apps/macos -c release
  windows:
    name: WinUI 3 compile (not a bundled engine release)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore apps/windows/FireSky/FireSky.csproj -r win-x64 -p:Platform=x64
      - run: dotnet build apps/windows/FireSky/FireSky.csproj --no-restore -c Release -p:Platform=x64 -r win-x64
