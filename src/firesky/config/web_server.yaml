# firesky Web 服务配置
#
# 启动：uvicorn firesky.api:create_app --factory --host 127.0.0.1 --port 8765
#   可用环境变量 FIRESKY_CONFIG 覆盖本文件路径。

server:
  host: 127.0.0.1          # 127.0.0.1=仅本机；0.0.0.0=全网
  port: 8765
  workers: null            # 预测并行进程数；null=自动
  aerosol_source: cams     # auto | cams | fallback
  report_dir: reports/web
  gfs_cache_dir: .cache/firesky/gfs
  ecmwf_cache_dir: .cache/firesky/ecmwf
  cams_cache_dir: .cache/cams
  map_cache_dir: .cache/firesky/map-frames
  regional_cache_dir: .cache/firesky/regional-forecasts
  point_cache_dir: .cache/firesky/point-forecasts
  satellite_cache_dir: .cache/firesky/himawari-hsd
  satellite_hcai_cache_dir: .cache/firesky/himawari-hcai
  satellite_warmup_token: null
  forecast_cache_seconds: 300

logging:
  level: INFO
  dir: logs
  app_name: firesky
