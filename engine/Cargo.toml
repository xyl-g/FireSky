[package]
name = "firesky-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
firesky-native = { path = "../native" }
libc = "0.2"
libloading = "0.8"
npyz = { version = "0.9", features = ["npz"] }
fs2 = "0.4"
flate2 = "1.1"
geo = { version = "0.33", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
regex = "1"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }
sha2 = "0.11"
tempfile = "3"

[build-dependencies]
sha2 = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
