[package]
name = "firesky-engine"
version = "1.10.5"
edition = "2021"
license = "GPL-3.0-only"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
axum = "0.8"
base64 = "0.22"
bzip2 = "0.4.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
csv = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
libloading = "0.8"
npyz = { version = "0.9", features = ["npz"] }
fs2 = "0.4"
futures-util = "0.3"
flate2 = "1.1"
geo = { version = "0.33", default-features = false }
# macOS 系统代理（GUI 启动无环境变量时，reqwest 遵循 SystemConfiguration）：
# macos-system-configuration 仅在 macOS 目标生效，其余平台无副作用。
reqwest = { version = "0.12", default-features = false, features = [
    "blocking", "rustls-tls", "macos-system-configuration",
] }
regex = "1"
quick-xml = "0.42"
rayon = "1.10"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
sha2 = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
